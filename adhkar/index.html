<!doctype html>
<html lang="fr" data-c="vert">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes Adhkar</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes Adhkar">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F4F5F1" id="tc">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
@font-face{font-family:"Medine";src:url("https://cdn.jsdelivr.net/npm/kfgqpc-uthmanic-script-hafs-regular@1.0.0/arabic.otf") format("opentype");font-display:swap}
/* Thèmes : une couleur principale + une couleur secondaire assortie (fonds neutres, pas teintés) */
:root{
  --card:#FFFFFF; --ink:#1D1F22; --muted:#6B6F76; --hard:#B04A3E; --hard-soft:#F6E1DD;
  --on-acc:#fff; --on-acc2:#fff; --on-h:#fff;
  --ar:"Medine","Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Vert + or */
  --paper:#F4F5F1; --tint:#ECEEE9; --line:#E2E5DE;
  --acc:#1F6B52; --acc-soft:#DCEDE4; --acc2:#E3CB97; --acc2-soft:#F8F1E2; --acc2-ink:#94660F; --on-acc2:#2A1F05; --h1:#1A5C46; --h2:#3E9C78;
}
/* Bleu marine + ambre */
:root[data-c="marine"]{--paper:#F5F4F1; --tint:#EDECE8; --line:#E4E2DC; --acc:#2C4F86; --acc-soft:#E1E8F4; --acc2:#EED3A0; --acc2-soft:#FAF3E6; --acc2-ink:#A2690C; --on-acc2:#2A1F05; --h1:#22436F; --h2:#4A74B0}
/* Rose + turquoise */
:root[data-c="rose"]{--paper:#FBF6F6; --tint:#F3EDEE; --line:#EEE3E5; --acc:#C24B7A; --acc-soft:#F9E0EA; --acc2:#A6D9D3; --acc2-soft:#E8F5F3; --acc2-ink:#1E7A72; --on-acc2:#0F3B37; --h1:#B23F6E; --h2:#E486AB}
/* Jaune + indigo */
:root[data-c="jaune"]{--paper:#FAF8F1; --tint:#F2EFE6; --line:#E8E3D4; --acc:#B07C08; --acc-soft:#FBEFCF; --acc2:#B7CBEF; --acc2-soft:#EDF2FB; --acc2-ink:#3462C2; --on-acc2:#14295A; --h1:#E0A21A; --h2:#F5CB4E; --on-h:#2A1F05}
@media (prefers-color-scheme:dark){:root:not([data-mode="light"]),:root:not([data-mode="light"])[data-c]{--paper:#111214; --card:#1B1C1F; --ink:#ECECEE; --muted:#9A9CA3; --line:#2C2D31; --tint:#222327; --hard:#E28C7E; --hard-soft:#3D2521;
    --on-acc:#101114; --on-acc2:#101114; color-scheme:dark;
    --acc:#6CC4A0; --acc-soft:#1E3A30; --acc2:#D4B47A; --acc2-soft:#332B1E; --acc2-ink:#D4B47A; --h1:#1A5C46; --h2:#2F8565}:root:not([data-mode="light"])[data-c="marine"]{--acc:#8EB0E6; --acc-soft:#22314C; --acc2:#DCBB82; --acc2-soft:#332A1C; --acc2-ink:#DCBB82; --on-acc2:#101114; --h1:#22406F; --h2:#3E68A6}:root:not([data-mode="light"])[data-c="rose"]{--acc:#F08DB4; --acc-soft:#4A2433; --acc2:#8CCBC4; --acc2-soft:#1B3633; --acc2-ink:#8CCBC4; --on-acc2:#101114; --h1:#8E2F57; --h2:#C2507E}:root:not([data-mode="light"])[data-c="jaune"]{--acc:#F2C14E; --acc-soft:#3E3214; --acc2:#A9BEE6; --acc2-soft:#232C42; --acc2-ink:#A9BEE6; --on-acc2:#101114; --h1:#C98F12; --h2:#E5B230; --on-h:#1E1604}
}
:root[data-mode="dark"],:root[data-mode="dark"][data-c]{--paper:#111214; --card:#1B1C1F; --ink:#ECECEE; --muted:#9A9CA3; --line:#2C2D31; --tint:#222327; --hard:#E28C7E; --hard-soft:#3D2521;
    --on-acc:#101114; --on-acc2:#101114; color-scheme:dark;
    --acc:#6CC4A0; --acc-soft:#1E3A30; --acc2:#D4B47A; --acc2-soft:#332B1E; --acc2-ink:#D4B47A; --h1:#1A5C46; --h2:#2F8565}:root[data-mode="dark"][data-c="marine"]{--acc:#8EB0E6; --acc-soft:#22314C; --acc2:#DCBB82; --acc2-soft:#332A1C; --acc2-ink:#DCBB82; --on-acc2:#101114; --h1:#22406F; --h2:#3E68A6}:root[data-mode="dark"][data-c="rose"]{--acc:#F08DB4; --acc-soft:#4A2433; --acc2:#8CCBC4; --acc2-soft:#1B3633; --acc2-ink:#8CCBC4; --on-acc2:#101114; --h1:#8E2F57; --h2:#C2507E}:root[data-mode="dark"][data-c="jaune"]{--acc:#F2C14E; --acc-soft:#3E3214; --acc2:#A9BEE6; --acc2-soft:#232C42; --acc2-ink:#A9BEE6; --on-acc2:#101114; --h1:#C98F12; --h2:#E5B230; --on-h:#1E1604}

html,body{background:var(--paper);color:var(--ink);margin:0}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
body{font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background .3s}
.wrap{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:16px}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:8px 0 -4px}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.ar{font-family:var(--ar);direction:rtl}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 1px 2px rgba(20,30,25,.04),0 8px 24px rgba(20,30,25,.05)}
:root{--fs:26px;--ar2:"Amiri","Noto Naskh Arabic","Geeza Pro",serif}
.ar{font-family:var(--ar2)}
.note{font-size:14px;color:var(--muted);margin:10px 0 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{padding:8px 12px;font-size:13px}
.btn svg{width:16px;height:16px}
.tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);background:var(--acc-soft);padding:5px 10px;border-radius:999px}
.sect{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:6px 2px -6px}
/* En-tête */
.hd{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:6px}
.hdt{min-width:0;display:flex;flex-direction:column}
.hs{font-size:20px;font-weight:700;color:var(--acc)}
.hd h1{font-size:32px;line-height:1.1;margin:2px 0 4px;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdate{font-size:15px;color:var(--muted)}
.hdr{flex:none;display:flex;align-items:center;gap:10px}
.stk{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:68px;padding:10px 0 8px;border-radius:22px;background:var(--acc2-soft);box-shadow:inset 0 0 0 1.5px var(--acc2)}
.stk svg{width:24px;height:24px}
.stk b{font-size:22px;font-weight:800;line-height:1.1}
.stk span{font-size:11px;font-weight:700;color:var(--acc2-ink);text-transform:uppercase;letter-spacing:.05em}
.stk.zero{background:var(--tint);box-shadow:none}
.stk.zero svg{filter:grayscale(1);opacity:.5}
.gear{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--ink);display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.05),0 6px 16px rgba(0,0,0,.06)}
/* Carte du moment */
.today{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:18px;border-radius:26px;padding:20px;color:var(--on-h);background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:0 12px 30px -12px var(--h1)}
.today>*:not(.geo){position:relative}
.geo{position:absolute;inset:-56px;width:calc(100% + 112px);height:calc(100% + 112px);opacity:.13;z-index:0;pointer-events:none}
.tring{position:relative;flex:none;width:92px;height:92px;display:grid;place-items:center}
.tring>svg{position:absolute;inset:0;width:100%;height:100%}
.tring b{font-size:22px;font-weight:800}
.tdone{position:relative;width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 6px currentColor}
.tdone svg{width:38px;height:38px}
.tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tt .tk{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.tt b{font-size:19px}
.tt span{font-size:14px;opacity:.9}
.tgo{align-self:flex-start;margin-top:8px;border:0;background:var(--on-h);color:var(--h1);border-radius:999px;padding:9px 12px 9px 16px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:2px}
.tgo svg{width:16px;height:16px}
/* Liste des séances */
.card.list{padding:4px 0}
.srw{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;padding:14px 16px;text-align:left;font:inherit;color:inherit}
.srw+.srw{border-top:1px solid var(--line)}
.srt{flex:1;min-width:0;font-weight:700;font-size:16px;display:flex;flex-direction:column;gap:8px}
.srv{color:var(--muted);font-size:14px;font-weight:700}
.srw .chv{flex:none;color:var(--muted)}
.dti{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--h1),var(--h2));color:var(--on-h);box-shadow:0 6px 14px -6px var(--h1)}
.dti svg{width:22px;height:22px}
.dti.big{width:52px;height:52px;border-radius:17px}
.dti.big svg{width:28px;height:28px}
.srw[data-go="s"] .dti{background:var(--acc2);color:var(--on-acc2);box-shadow:0 6px 14px -6px var(--acc2)}
.srw[data-go="n"] .dti{background:var(--acc-soft);color:var(--acc);box-shadow:none}
.dtb{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.dtb i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:3px;transition:width .6s}
.okb{flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center}
/* Semaine */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--muted)}
.wd i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tint);font-style:normal;color:var(--muted)}
.wd.full i{background:var(--acc);color:var(--on-acc)}
.wd.part i{background:var(--acc2-soft);border:2px solid var(--acc2)}
.wd.miss i{background:var(--hard-soft)}
.wd.none i{background:none;border:1.5px solid var(--line);opacity:.5}
.wd.future i,.wd.todo i{background:none;border:1.5px solid var(--line)}
.wd.now span{color:var(--acc)}
.wd.now i{outline:2px solid var(--acc);outline-offset:2px}
.wkline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.wkline b{color:var(--ink);font-size:16px}
/* Séance */
.shd{display:flex;align-items:center;gap:14px;padding-top:6px}
.shd h1{font-size:26px}
.rvp{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:3;background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:20px;padding:12px 16px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.06)}
.rvt{display:flex;justify-content:space-between;align-items:baseline}
.rvt b{font-size:22px;font-weight:800}
.rvt small{font-size:14px;font-weight:600;color:var(--muted)}
.rvt span{font-weight:800;color:var(--acc);font-size:14px}
.rvbar{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.rvbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--h2));transition:width .6s cubic-bezier(.3,.7,.2,1)}
.dks-list{display:flex;flex-direction:column;gap:12px}
.dk{scroll-margin-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-user-select:none;user-select:none;cursor:pointer}
.dk.long{-webkit-user-select:text;user-select:text;cursor:auto}
.dkh{display:flex;align-items:center;gap:10px}
.dkt{flex:1;min-width:0;font-size:15px}
.sp{flex:1}
.dks{margin:10px 0 0;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.how{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--tint);font-size:14px;line-height:1.4}
.how svg{flex:none;color:var(--acc);margin-top:1px}
.pre{text-align:center;font-size:calc(var(--fs) * .78);color:var(--muted);margin-top:12px;direction:rtl}
.dka{direction:rtl;text-align:right;font-size:var(--fs);line-height:2.05;margin-top:12px;color:var(--ink)}
.dka.ar{text-align:justify;text-align-last:right}
.dka.q{font-family:var(--ar)}
.qt{margin:0;text-align:justify;text-align-last:right;line-height:2.15}
.vn{color:var(--acc);font-family:"Amiri",serif;font-size:.8em;white-space:nowrap}
.sh2{font-family:var(--ar);text-align:center;font-size:calc(var(--fs) * .78);font-weight:700;color:var(--acc);border:1.5px solid var(--acc2);border-radius:14px;padding:2px 0;margin:12px 0 4px;background:var(--acc2-soft)}
.sh2:first-child{margin-top:0}
.bsm{font-family:var(--ar);text-align:center;font-size:calc(var(--fs) * .85);margin:2px 0}
.dkf{margin:12px 0 0;font-size:15px;line-height:1.5;color:var(--muted)}
.fd{display:flex;gap:8px;align-items:flex-start;margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--acc2-soft);color:var(--ink);font-size:14px;line-height:1.4}
.fd svg{flex:none;color:var(--acc2-ink);margin-top:1px}
.dkc{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.dkp{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dkp .num{font-size:13px;font-weight:700;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--tint);box-shadow:inset 0 0 0 1.5px var(--line);transition:background .2s,transform .2s}
.dots i.on{background:var(--acc);box-shadow:none;transform:scale(1.05)}
.lbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .15s}
.cbtn{flex:none;position:relative;width:64px;height:64px;border-radius:50%;border:0;padding:0;background:conic-gradient(var(--acc) var(--r),var(--acc-soft) 0);display:grid;place-items:center;box-shadow:0 8px 18px -8px var(--acc);transition:transform .12s}
.cbtn::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--card)}
.cbtn b{position:relative;font-size:22px;font-weight:800;color:var(--acc);display:grid;place-items:center}
.cbtn b svg{width:24px;height:24px}
.cbtn:active{transform:scale(.94)}
.hint{margin:8px 0 0;text-align:right;font-size:12px;color:var(--muted)}
.dkc .dkok{flex:1;display:flex;align-items:center;gap:6px;font-weight:800;color:var(--acc)}
.dk.done{box-shadow:inset 0 0 0 1.5px var(--acc-soft),0 1px 2px rgba(20,30,25,.04)}
.dk.mini{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;opacity:.78;box-shadow:0 1px 2px rgba(20,30,25,.04)}
.dk.mini .mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;font-size:15px;color:var(--muted)}
.dk.mini .mt.ar{direction:rtl;text-align:right;font-size:20px;font-weight:400;line-height:1.5}
.dk.mini .mx{font-size:13px;font-weight:700;color:var(--muted)}
.dk.mini>svg{flex:none;color:var(--muted)}
.dk.next{box-shadow:0 0 0 2.5px var(--acc),0 10px 26px -12px var(--acc)}
.reset{width:100%;border:0;background:var(--hard-soft);color:var(--hard);border-radius:999px;padding:15px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:4px}
/* Terminé */
.fin{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;gap:14px;border-radius:22px;padding:16px;color:var(--on-h);background:linear-gradient(135deg,var(--h1),var(--h2));box-shadow:0 10px 24px -12px var(--h1)}
.fin>*:not(.geo):not(.cf){position:relative}
.fin .geo{opacity:.12}
.fbadge{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--acc2);color:var(--on-acc2);box-shadow:0 0 0 5px rgba(255,255,255,.18)}
.fbadge svg{width:26px;height:26px}
.fx{min-width:0;display:flex;flex-direction:column;gap:2px}
.fin h2{margin:0;font-size:18px;font-weight:800}
.fin p{margin:0;font-size:14px;opacity:.9}
.fnext{align-self:flex-start;margin-top:6px;font-size:13px;font-weight:700;background:rgba(0,0,0,.14);border-radius:999px;padding:5px 11px}
.cf{position:absolute;top:-10px;display:block;border-radius:2px;pointer-events:none;animation:cf 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes cf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),260px) rotate(var(--r));opacity:0}}
/* Réglages */
.sheet{position:fixed;inset:0;z-index:25;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,12,16,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
body.sheet-open{overflow:hidden}
.sheet-in{position:relative;width:100%;max-width:560px;max-height:88%;overflow-y:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:22px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-in h2{margin:2px 0 8px;font-size:24px;font-weight:800}
.ddk{display:block;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.shx{position:absolute;right:16px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--tint);font-size:22px;line-height:1;color:var(--muted)}
.fl{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.field{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.th{border:2px solid transparent;background:var(--card);border-radius:18px;padding:14px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink)}
.th.on{border-color:var(--acc)}
.th i{width:40px;height:40px;border-radius:50%;display:block}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--tint);border-radius:18px;padding:5px}
.seg3 button{border:0;background:none;border-radius:14px;padding:11px 0;font-weight:700;font-size:14px;color:var(--muted)}
.seg3 button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
