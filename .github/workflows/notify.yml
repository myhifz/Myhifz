name: Notifications Mon Hifz
on:
  push:
    branches: [main]
    paths: ["sauvegardes/*.json"]
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save web-push@3.6.7
      - run: node .github/notify/notify.js
        env:
          BEFORE: ${{ github.event.before }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
