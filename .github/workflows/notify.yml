name: Notifications Mon Hifz
on:
  push:
    branches: [sauvegardes]
    paths: ["sauvegardes/*.json"]
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - run: node .github/notify/notify.js
        env:
          BEFORE: ${{ github.event.before }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
