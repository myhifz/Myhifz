<!doctype html>
<html lang="fr" data-c="vert">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Hifz</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Hifz">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F3EC" id="tc">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Base neutrals (light / dark) */
:root{
  --paper:#F2F4F0; --card:#FFFFFF; --ink:#1C2A25; --muted:#66736C; --line:#E1E5DE;
  --hard:#B04A3E; --hard-soft:#F6E1DD;
  --ar:"Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Thème vert par défaut */
  --acc:#1F5A47; --acc-soft:#DDEBE3; --acc2:#B0832B; --acc2-soft:#F4EAD3; --h1:#1F5A47; --h2:#6DBB9C; --tint:#EEF4F0;
}
:root[data-c="rose"]{--paper:#FBF2F5; --acc:#C24B7A; --acc-soft:#FADCE7; --acc2:#B9805A; --acc2-soft:#F7E6DA; --h1:#B23F6E; --h2:#F09DBD; --tint:#FCEAF1; --line:#F0DEE5}
:root[data-c="marine"]{--paper:#F1F4F9; --acc:#2C4F86; --acc-soft:#DCE5F3; --acc2:#B98A3E; --acc2-soft:#F3E8D2; --h1:#26467A; --h2:#7FA3D8; --tint:#E8EEF7; --line:#DDE3EE}
@media (prefers-color-scheme:dark){
  :root{--paper:#111816; --card:#19221F; --ink:#E8EDE7; --muted:#95A29B; --line:#2A3531; --hard:#E28C7E; --hard-soft:#3D2521;
    --acc:#78C4A4; --acc-soft:#1E3A30; --acc2:#DDB05C; --acc2-soft:#3A3020; --h1:#1F5A47; --h2:#3E8C6E; --tint:#17261F; color-scheme:dark}
  :root[data-c="rose"]{--paper:#1A1316; --card:#241B1F; --line:#382A30; --acc:#F08DB4; --acc-soft:#4A2433; --acc2:#E0A982; --acc2-soft:#3D2C22; --h1:#8E2F57; --h2:#C9578A; --tint:#2A1C22}
  :root[data-c="marine"]{--paper:#10141C; --card:#181E29; --line:#283142; --acc:#8EB0E6; --acc-soft:#22314C; --acc2:#DDB05C; --acc2-soft:#3A3020; --h1:#22406F; --h2:#4F76B3; --tint:#1A2232}
}
html,body{background:var(--paper);color:var(--ink);margin:0}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
body{font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background .3s}
.wrap{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:16px}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:8px 0 -4px}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.ar{font-family:var(--ar);direction:rtl}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 1px 2px rgba(20,30,25,.04),0 8px 24px rgba(20,30,25,.05)}

/* Accueil */
.hello{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:52px;height:52px;border-radius:16px;background:var(--card);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.hello .txt{flex:1;min-width:0}
.hello h1{font-size:23px}
.fire{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:10px 16px;font-weight:800;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.fire svg{width:22px;height:22px}
.status{display:flex;align-items:center;gap:16px;text-align:left;width:100%;border:0}
.status .ic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.status b{display:block;font-size:17px}
.status span{color:var(--muted);font-size:15px}
.hero{border-radius:28px;padding:22px 24px 26px;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2));text-align:center;box-shadow:0 12px 30px -10px var(--h1)}
.hero .t{font-weight:600;font-size:17px;opacity:.92}
.ring{position:relative;width:170px;height:170px;margin:14px auto 18px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center}
.ring .p{font-size:46px;font-weight:800;line-height:1}
.ring .s{font-size:14px;opacity:.85;margin-top:6px}
.hbar{height:10px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.hbar i{display:block;height:100%;background:rgba(255,255,255,.8);border-radius:5px;transition:width .5s}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:center;padding:20px 16px 18px}
.tile.n{background:var(--acc-soft)}
.tile .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px}
.tile.n .ic{color:var(--acc)} .tile.o .ic{background:var(--acc2-soft);color:var(--acc2)}
.tile .p{font-size:32px;font-weight:800;line-height:1.1}
.tile .k{font-weight:700;font-size:17px}
.tile .s{color:var(--muted);font-size:14px}
.tbar{height:7px;border-radius:4px;background:rgba(0,0,0,.06);margin-top:12px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:4px}
.tile.n .tbar i{background:var(--acc)} .tile.o .tbar i{background:var(--acc2)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sgrid div{border-radius:18px;padding:14px 6px;text-align:center;background:var(--tint)}
.sgrid div:nth-child(2){background:var(--acc2-soft)}
.sgrid b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.sgrid span{font-size:13px;color:var(--muted)}
.ctitle{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.ctitle svg{color:var(--acc)}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line);max-width:100%}
.heat i.l1{background:var(--acc-soft)} .heat i.l2{background:var(--acc)}

/* Listes */
.list{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.medal{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--acc2);color:var(--acc2);display:grid;place-items:center;font-size:13px;font-weight:800}
.name{flex:1;min-width:0}
.name .t{font-weight:700}
.name .m{font-size:13px;color:var(--muted)}
.right{text-align:right;font-size:22px}
.bar{display:flex;gap:3px;margin-top:6px}
.bar i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.bar i.on{background:var(--acc)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.rate button{border:0;border-radius:14px;padding:12px 4px;font-weight:700;font-size:14px}
.r-hard{background:var(--hard-soft);color:var(--hard)}
.r-mid{background:var(--acc2-soft);color:var(--acc2)}
.r-easy{background:var(--acc-soft);color:var(--acc)}
.empty{text-align:center;padding:26px 18px}
.empty .ar{font-size:32px;color:var(--acc)}
.empty p{color:var(--muted);margin:8px 0 0}
.search{width:100%;border:0;background:var(--card);border-radius:16px;padding:14px 16px;font:inherit;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.add{border-style:dashed;color:var(--acc);border-color:var(--acc)}
.slist{padding:4px 16px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.check{flex:none;width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.check.on{background:var(--acc);border-color:var(--acc);color:#fff}

/* Réglages */
.field{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;margin-top:10px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.th{border:2px solid transparent;background:var(--paper);border-radius:18px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:14px}
.th.on{border-color:var(--acc)}
.th i{width:44px;height:44px;border-radius:50%;display:block}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:10px;font:12px ui-monospace,monospace;margin-top:10px}
.note{font-size:14px;color:var(--muted)}

/* Barre du bas */
nav{position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:30px;display:flex;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:5}
nav button{flex:1;border:0;background:none;border-radius:24px;padding:8px 2px 7px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--acc);background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.08)}
nav button.on span{font-weight:800}
nav svg{width:24px;height:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:9;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.card,.hero{animation:in .3s ease}@keyframes in{from{transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<nav id="nav">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Accueil</span></button>
  <button data-tab="rev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h6a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H3zM21 5h-6a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h7z"/></svg><span>Révision</span></button>
  <button data-tab="surahs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Sourates</span></button>
  <button data-tab="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Réglages</span></button>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
const RAW="Al-Fatiha|الفاتحة|7;Al-Baqara|البقرة|286;Al-Imran|آل عمران|200;An-Nisa|النساء|176;Al-Ma'ida|المائدة|120;Al-An'am|الأنعام|165;Al-A'raf|الأعراف|206;Al-Anfal|الأنفال|75;At-Tawba|التوبة|129;Yunus|يونس|109;Hud|هود|123;Yusuf|يوسف|111;Ar-Ra'd|الرعد|43;Ibrahim|إبراهيم|52;Al-Hijr|الحجر|99;An-Nahl|النحل|128;Al-Isra|الإسراء|111;Al-Kahf|الكهف|110;Maryam|مريم|98;Ta-Ha|طه|135;Al-Anbiya|الأنبياء|112;Al-Hajj|الحج|78;Al-Mu'minun|المؤمنون|118;An-Nur|النور|64;Al-Furqan|الفرقان|77;Ash-Shu'ara|الشعراء|227;An-Naml|النمل|93;Al-Qasas|القصص|88;Al-Ankabut|العنكبوت|69;Ar-Rum|الروم|60;Luqman|لقمان|34;As-Sajda|السجدة|30;Al-Ahzab|الأحزاب|73;Saba|سبأ|54;Fatir|فاطر|45;Ya-Sin|يس|83;As-Saffat|الصافات|182;Sad|ص|88;Az-Zumar|الزمر|75;Ghafir|غافر|85;Fussilat|فصلت|54;Ash-Shura|الشورى|53;Az-Zukhruf|الزخرف|89;Ad-Dukhan|الدخان|59;Al-Jathiya|الجاثية|37;Al-Ahqaf|الأحقاف|35;Muhammad|محمد|38;Al-Fath|الفتح|29;Al-Hujurat|الحجرات|18;Qaf|ق|45;Adh-Dhariyat|الذاريات|60;At-Tur|الطور|49;An-Najm|النجم|62;Al-Qamar|القمر|55;Ar-Rahman|الرحمن|78;Al-Waqi'a|الواقعة|96;Al-Hadid|الحديد|29;Al-Mujadila|المجادلة|22;Al-Hashr|الحشر|24;Al-Mumtahana|الممتحنة|13;As-Saff|الصف|14;Al-Jumu'a|الجمعة|11;Al-Munafiqun|المنافقون|11;At-Taghabun|التغابن|18;At-Talaq|الطلاق|12;At-Tahrim|التحريم|12;Al-Mulk|الملك|30;Al-Qalam|القلم|52;Al-Haqqa|الحاقة|52;Al-Ma'arij|المعارج|44;Nuh|نوح|28;Al-Jinn|الجن|28;Al-Muzzammil|المزمل|20;Al-Muddaththir|المدثر|56;Al-Qiyama|القيامة|40;Al-Insan|الإنسان|31;Al-Mursalat|المرسلات|50;An-Naba|النبأ|40;An-Nazi'at|النازعات|46;Abasa|عبس|42;At-Takwir|التكوير|29;Al-Infitar|الانفطار|19;Al-Mutaffifin|المطففين|36;Al-Inshiqaq|الانشقاق|25;Al-Buruj|البروج|22;At-Tariq|الطارق|17;Al-A'la|الأعلى|19;Al-Ghashiya|الغاشية|26;Al-Fajr|الفجر|30;Al-Balad|البلد|20;Ash-Shams|الشمس|15;Al-Layl|الليل|21;Ad-Duha|الضحى|11;Ash-Sharh|الشرح|8;At-Tin|التين|8;Al-Alaq|العلق|19;Al-Qadr|القدر|5;Al-Bayyina|البينة|8;Az-Zalzala|الزلزلة|8;Al-Adiyat|العاديات|11;Al-Qari'a|القارعة|11;At-Takathur|التكاثر|8;Al-Asr|العصر|3;Al-Humaza|الهمزة|9;Al-Fil|الفيل|5;Quraysh|قريش|4;Al-Ma'un|الماعون|7;Al-Kawthar|الكوثر|3;Al-Kafirun|الكافرون|6;An-Nasr|النصر|3;Al-Masad|المسد|5;Al-Ikhlas|الإخلاص|4;Al-Falaq|الفلق|5;An-Nas|الناس|6";
const S=RAW.split(";").map((x,i)=>{const[t,a,n]=x.split("|");return{id:i+1,t,a,n:+n}});
const BY=Object.fromEntries(S.map(x=>[x.id,x]));
const TOTAL=S.reduce((s,x)=>s+x.n,0);
const IV=[1,2,4,7,14,30,60];
const KEY="murajaa-v1";
const THEMES={vert:{n:"Vert",c:["#1F5A47","#6DBB9C"],tc:"#F2F4F0"},rose:{n:"Rose",c:["#B23F6E","#F09DBD"],tc:"#FBF2F5"},marine:{n:"Bleu marine",c:["#26467A","#7FA3D8"],tc:"#F1F4F9"}};
let st={s:{},log:{},done:{},cfg:{c:"vert",name:""}}, tab="home", filter="all", q="";
try{const v=localStorage.getItem(KEY); if(v) st=Object.assign(st,JSON.parse(v));}catch(e){}
st.done=st.done||{}; st.cfg=Object.assign({c:"vert",name:""},st.cfg||{});
try{const t=localStorage.getItem(KEY+"-tab"); if(t&&["home","rev","surahs","set"].includes(t)) tab=t;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};

const pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00");d.setDate(d.getDate()+n);return ds(d)};
const diff=(a,b)=>Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/864e5);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function applyTheme(){const c=THEMES[st.cfg.c]?st.cfg.c:"vert";document.documentElement.dataset.c=c;
  const dark=matchMedia("(prefers-color-scheme: dark)").matches;$("tc").content=dark?getComputedStyle(document.documentElement).getPropertyValue("--paper").trim():THEMES[c].tc}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1900)}
function streak(){let n=0,d=today();if(!st.log[d])d=addDays(d,-1);while(st.log[d]){n++;d=addDays(d,-1)}return n}
function record(){const ks=Object.keys(st.log).filter(k=>st.log[k]).sort();let best=0,cur=0,prev=null;ks.forEach(k=>{cur=prev&&diff(k,prev)===1?cur+1:1;best=Math.max(best,cur);prev=k});return best}
function memo(){return S.filter(x=>st.s[x.id])}
function due(){const t=today();return memo().filter(x=>st.s[x.id].due<=t).sort((a,b)=>st.s[a.id].due.localeCompare(st.s[b.id].due)||a.id-b.id)}
function bar(lv){return '<div class="bar">'+IV.map((_,i)=>'<i class="'+(i<=lv?"on":"")+'"></i>').join("")+"</div>"}
function ago(x){const r=st.s[x.id];if(!r.last)return"Jamais révisée ici";const d=diff(today(),r.last);return d===0?"Révisée aujourd'hui":d===1?"Révisée hier":"Révisée il y a "+d+" j"}

/* Plan du jour : ce qui reste + ce qui est déjà fait, séparé en récentes (niveau 0-1) et anciennes */
function dayPlan(){
  const t=today(), done=(st.done[t]||[]).filter(d=>BY[d.id]), doneIds=new Set(done.map(d=>d.id));
  const left=due().filter(x=>!doneIds.has(x.id));
  const isNew=x=>st.s[x.id].lv<=1;
  const nTot=done.filter(d=>d.nw).length+left.filter(isNew).length, nDone=done.filter(d=>d.nw).length;
  const oTot=done.filter(d=>!d.nw).length+left.filter(x=>!isNew(x)).length, oDone=done.filter(d=>!d.nw).length;
  return{left,done,tot:done.length+left.length,nDone,nTot,oDone,oTot,ay:left.reduce((s,x)=>s+x.n,0)}}

function addSurahs(ids){let i=0,t=today();ids.forEach(id=>{if(!st.s[id]){st.s[id]={lv:0,due:addDays(t,Math.floor(i/5)),last:null};i++}});save();return i}
function rate(id,r){const x=st.s[id],t=today(),nw=x.lv<=1;
  x.lv = r==="hard"?0 : r==="easy"?Math.min(x.lv+1,IV.length-1) : x.lv;
  x.due=addDays(t,IV[x.lv]); x.last=t; st.log[t]=(st.log[t]||0)+1;
  st.done[t]=(st.done[t]||[]).filter(d=>d.id!==id).concat({id,nw});
  Object.keys(st.done).forEach(k=>{if(diff(t,k)>40)delete st.done[k]});
  save(); toast("Prochaine révision dans "+IV[x.lv]+" j"); render()}

const ICON='<svg width="30" height="30" viewBox="0 0 24 24"><g fill="var(--acc2)"><rect x="5" y="5" width="14" height="14" rx="1"/><rect x="5" y="5" width="14" height="14" rx="1" transform="rotate(45 12 12)"/></g><circle cx="12" cy="12" r="3.6" fill="var(--card)"/><circle cx="12" cy="12" r="2" fill="var(--acc)"/></svg>';
const FLAME='<svg viewBox="0 0 24 24"><defs><linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#E8432E"/><stop offset="1" stop-color="#FFA92E"/></linearGradient></defs><path fill="url(#fg)" d="M12 2c1 3.5 5 5.6 5 10.5A5.2 5.2 0 0 1 12 18a5.2 5.2 0 0 1-5-5.5c0-2.3 1.2-3.8 2.4-5 .1 1.6.8 2.7 1.8 3.3C11 7.9 11.4 4.6 12 2z"/><path fill="#FFD36E" d="M12 11c.6 1.5 2.3 2.4 2.3 4.4A2.3 2.3 0 0 1 12 18a2.3 2.3 0 0 1-2.3-2.6c0-1.3.7-2 1.3-2.6.1.7.4 1.1.8 1.3-.1-1.1.1-2.3.2-3.1z"/></svg>';

function vHome(){
  const now=new Date(),date=now.toLocaleDateString("fr-BE",{weekday:"long",day:"numeric",month:"long"});
  const m=memo(),p=dayPlan(),pct=p.tot?Math.round(p.done.length/p.tot*100):0;
  const name=st.cfg.name.trim();
  let h='<div class="hello"><div class="logo">'+ICON+'</div><div class="txt"><h1>Salam Aleykoum'+(name?", "+esc(name):"")+'</h1><div class="sub">'+date.charAt(0).toUpperCase()+date.slice(1)+'</div></div><div class="fire">'+FLAME+'<span class="num">'+streak()+'</span></div></div>';
  if(!m.length){
    return h+'<div class="card empty"><div class="ar">بسم الله</div><p>Coche les sourates que tu connais déjà pour commencer. Elles seront réparties sur les prochains jours.</p><div class="chips" style="justify-content:center;margin-top:16px"><button class="chip add" data-bulk="78-114">+ Juz \'Amma</button><button class="chip add" data-bulk="67-77">+ Juz Tabarak</button><button class="chip" data-tab="surahs">Choisir à la main</button></div></div>'}
  const msg=p.left.length?["En cours","Continue sur ta lancée ! Il te reste "+p.left.length+" sourate"+(p.left.length>1?"s":"")+" ("+p.ay+" versets) à réviser aujourd'hui."]
    :p.done.length?["Terminé","Ma sha Allah, ta révision du jour est faite."]:["Repos","Rien à réviser aujourd'hui. Profites-en pour avancer sur du nouveau."];
  h+='<button class="card status" data-tab="rev"><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c2.5 4 6 6.8 6 11a6 6 0 0 1-12 0c0-4.2 3.5-7 6-11z"/></svg></div><div><b>'+msg[0]+'</b><span>'+msg[1]+'</span></div></button>';
  const R=70,C=2*Math.PI*R;
  h+='<div class="hero"><div class="t">Progression du jour</div><div class="ring"><svg viewBox="0 0 170 170"><circle cx="85" cy="85" r="'+R+'" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.22)" stroke-width="8"/><circle cx="85" cy="85" r="'+R+'" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct/100))+'"/></svg><div class="in"><div class="p num">'+pct+'%</div><div class="s num">'+p.done.length+'/'+p.tot+' sourates</div></div></div><div class="hbar"><i style="width:'+pct+'%"></i></div></div>';
  const tp=(a,b)=>b?Math.round(a/b*100):100;
  h+='<div class="tiles"><div class="card tile n"><div class="ic"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.3L12 17.1l-5.7 3.1 1.2-6.3L2.8 9.5l6.4-.8z"/></svg></div><div class="p num">'+tp(p.nDone,p.nTot)+'%</div><div class="k">Récentes</div><div class="s num">'+p.nDone+'/'+p.nTot+' sourates</div><div class="tbar"><i style="width:'+tp(p.nDone,p.nTot)+'%"></i></div></div>'
    +'<div class="card tile o"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l10 5-10 5L2 7z"/><path d="M2 12l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2 17l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2"/></svg></div><div class="p num">'+tp(p.oDone,p.oTot)+'%</div><div class="k">Anciennes</div><div class="s num">'+p.oDone+'/'+p.oTot+' sourates</div><div class="tbar"><i style="width:'+tp(p.oDone,p.oTot)+'%"></i></div></div></div>';
  const ay=m.reduce((s,x)=>s+x.n,0),cp=ay/TOTAL*100;
  h+='<div class="card"><div class="ctitle"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Tes statistiques</div><div class="sgrid"><div><b class="num">'+m.length+'</b><span>Sourates</span></div><div><b class="num">'+streak()+'</b><span>Série</span></div><div><b class="num">'+record()+'</b><span>Record</span></div></div></div>';
  let cells="";for(let i=29;i>=0;i--){const d=addDays(today(),-i),n=st.log[d]||0;cells+='<i class="'+(n>=3?"l2":n?"l1":"")+'"></i>'}
  h+='<div class="card"><div class="row" style="justify-content:space-between"><div class="ctitle">Coran mémorisé</div><b class="num" style="font-size:22px">'+cp.toFixed(1)+' %</b></div><div class="note num" style="margin-top:2px">'+ay+' / '+TOTAL+' versets</div><div class="prog"><i style="width:'+cp+'%"></i></div><div class="note" style="margin-top:16px">30 derniers jours</div><div class="heat">'+cells+'</div></div>';
  return h}

function vRev(){
  const p=dayPlan(),m=memo();
  let h='<div><h1>Révision</h1><div class="sub num">'+(p.left.length?p.left.length+" à faire · "+p.ay+" versets":"Tout est à jour")+'</div></div>';
  if(!m.length)return h+'<div class="card empty"><p>Ajoute d\'abord tes sourates dans l\'onglet Sourates.</p><div class="chips" style="justify-content:center;margin-top:14px"><button class="chip" data-tab="surahs">Aller aux sourates</button></div></div>';
  if(!p.left.length){
    const next=m.slice().sort((a,b)=>st.s[a.id].due.localeCompare(st.s[b.id].due)).slice(0,4);
    return h+'<div class="card empty"><div class="ar">ما شاء الله</div><p>Rien d\'autre à réviser aujourd\'hui.</p></div><div class="lbl">Prochaines révisions</div><div class="list">'+next.map(x=>'<div class="card row"><div class="medal num">'+x.id+'</div><div class="name"><div class="t">'+x.t+'</div><div class="m">Dans '+diff(st.s[x.id].due,today())+' j</div></div><div class="ar right">'+x.a+'</div></div>').join("")+"</div>"}
  h+='<div class="list">'+p.left.map(x=>{const r=st.s[x.id],late=diff(today(),r.due);
    return'<div class="card"><div class="row"><div class="medal num">'+x.id+'</div><div class="name"><div class="t">'+x.t+'</div><div class="m num">'+x.n+' versets · '+ago(x)+(late>0?' · <span style="color:var(--hard)">'+late+' j de retard</span>':'')+'</div>'+bar(r.lv)+'</div><div class="ar right">'+x.a+'</div></div><div class="rate"><button class="r-hard" data-rate="hard" data-id="'+x.id+'">Difficile</button><button class="r-mid" data-rate="mid" data-id="'+x.id+'">Moyen</button><button class="r-easy" data-rate="easy" data-id="'+x.id+'">Facile</button></div></div>'}).join("")+"</div>";
  return h+'<p class="note">Difficile : tu la revois demain. Moyen : même rythme. Facile : l\'écart s\'allonge, jusqu\'à 60 jours.</p>'}

function vSurahs(){
  const m=memo().length;
  let h='<div><h1>Sourates</h1><div class="sub num">'+m+' / 114 mémorisées</div></div><input class="search" id="q" type="search" placeholder="Chercher (nom ou numéro)" value="'+esc(q)+'">';
  h+='<div class="chips"><button class="chip '+(filter==="all"?"on":"")+'" data-filter="all">Toutes</button><button class="chip '+(filter==="mem"?"on":"")+'" data-filter="mem">Mémorisées</button><button class="chip add" data-bulk="78-114">+ Juz \'Amma</button><button class="chip add" data-bulk="67-77">+ Tabarak</button></div><div class="card slist">';
  const qq=q.trim().toLowerCase();
  const rows=S.filter(x=>(filter==="all"||st.s[x.id])&&(!qq||x.t.toLowerCase().includes(qq)||String(x.id)===qq||x.a.includes(q.trim())));
  if(!rows.length)h+='<p class="note" style="padding:12px 0">Aucune sourate trouvée.</p>';
  rows.forEach(x=>{const on=!!st.s[x.id];
    h+='<div class="srow"><button class="check '+(on?"on":"")+'" data-toggle="'+x.id+'" aria-label="'+(on?"Retirer ":"Ajouter ")+x.t+'">'+(on?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5L20 7"/></svg>':"")+'</button><div class="name"><div class="t"><span class="num" style="color:var(--acc2)">'+x.id+'.</span> '+x.t+'</div><div class="m num">'+x.n+' versets</div>'+(on?bar(st.s[x.id].lv):"")+'</div><div class="ar right" style="font-size:20px">'+x.a+'</div></div>'});
  return h+"</div>"}

function vSet(){
  return'<h1>Réglages</h1>'
  +'<div class="card"><div class="ctitle">Ton prénom</div><input class="field" id="nm" type="text" placeholder="Pour l\'accueil (facultatif)" value="'+esc(st.cfg.name)+'" maxlength="24" autocomplete="given-name"></div>'
  +'<div class="card"><div class="ctitle">Couleur</div><div class="themes">'+Object.entries(THEMES).map(([k,t])=>'<button class="th '+(st.cfg.c===k?"on":"")+'" data-theme-c="'+k+'"><i style="background:linear-gradient(135deg,'+t.c[0]+','+t.c[1]+')"></i>'+t.n+'</button>').join("")+'</div></div>'
  +'<div class="card"><div class="ctitle">Sauvegarde</div><p class="note">Tes données restent sur ce téléphone. Copie une sauvegarde de temps en temps et garde-la dans tes notes.</p><div class="chips"><button class="btn pri" data-act="export">Copier la sauvegarde</button><button class="btn" data-act="showimp">Restaurer</button></div><div id="imp" hidden><textarea id="impt" placeholder="Colle ta sauvegarde ici"></textarea><div class="chips" style="margin-top:10px"><button class="btn pri" data-act="import">Restaurer ces données</button></div></div><textarea id="expt" hidden readonly></textarea></div>'}

function render(){
  $("app").innerHTML=tab==="home"?vHome():tab==="rev"?vRev():tab==="surahs"?vSurahs():vSet();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  const qi=$("q");if(qi)qi.oninput=e=>{q=e.target.value;const p=qi.selectionStart;render();const n=$("q");n.focus();n.setSelectionRange(p,p)};
  const nm=$("nm");if(nm)nm.oninput=e=>{st.cfg.name=e.target.value;save()};
}
function go(t){tab=t;try{localStorage.setItem(KEY+"-tab",t)}catch(e){}render();scrollTo(0,0)}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.tab)go(d.tab);
  else if(d.rate)rate(+d.id,d.rate);
  else if(d.filter){filter=d.filter;render()}
  else if(d.themeC){st.cfg.c=d.themeC;save();applyTheme();render();toast("Thème "+THEMES[d.themeC].n)}
  else if(d.toggle){const id=+d.toggle;if(st.s[id]){delete st.s[id];toast("Retirée")}else{st.s[id]={lv:0,due:addDays(today(),1),last:null};toast("Ajoutée, à réviser demain")}save();render()}
  else if(d.bulk){const[a,z]=d.bulk.split("-").map(Number),ids=[];for(let i=a;i<=z;i++)ids.push(i);const n=addSurahs(ids);toast(n?n+" sourates ajoutées":"Déjà toutes ajoutées");render()}
  else if(d.act==="export"){const txt=JSON.stringify(st);const ta=$("expt");ta.value=txt;
    const fb=()=>{ta.hidden=false;ta.select();toast("Sélectionne et copie le texte")};
    if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("Sauvegarde copiée"),fb);else fb()}
  else if(d.act==="showimp"){$("imp").hidden=false}
  else if(d.act==="import"){try{const v=JSON.parse($("impt").value);if(!v.s||!v.log)throw 0;st=Object.assign({s:{},log:{},done:{},cfg:{c:"vert",name:""}},v);save();applyTheme();toast("Données restaurées");render()}catch(x){toast("Colle la sauvegarde complète")}}
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme);
applyTheme();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
