<!doctype html>
<html lang="fr" data-c="vert">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mon Hifz</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Hifz">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F2F3EC" id="tc">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/rose.png">
<link rel="icon" href="icons/rose.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
@font-face{font-family:"Medine";src:url("https://cdn.jsdelivr.net/npm/kfgqpc-uthmanic-script-hafs-regular@1.0.0/arabic.otf") format("opentype");font-display:swap}
/* Thèmes : une couleur principale + une couleur secondaire assortie (fonds neutres, pas teintés) */
:root{
  --card:#FFFFFF; --ink:#1D1F22; --muted:#6B6F76; --hard:#B04A3E; --hard-soft:#F6E1DD;
  --on-acc:#fff; --on-acc2:#fff; --on-h:#fff;
  --ar:"Medine","Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  --ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Vert + or */
  --paper:#F4F5F1; --tint:#ECEEE9; --line:#E2E5DE;
  --acc:#1F6B52; --acc-soft:#DCEDE4; --acc2:#E3CB97; --acc2-soft:#F8F1E2; --acc2-ink:#94660F; --on-acc2:#2A1F05; --h1:#1A5C46; --h2:#3E9C78;
}
/* Bleu marine + ambre */
:root[data-c="marine"]{--paper:#F5F4F1; --tint:#EDECE8; --line:#E4E2DC; --acc:#2C4F86; --acc-soft:#E1E8F4; --acc2:#EED3A0; --acc2-soft:#FAF3E6; --acc2-ink:#A2690C; --on-acc2:#2A1F05; --h1:#22436F; --h2:#4A74B0}
/* Rose + turquoise */
:root[data-c="rose"]{--paper:#FBF6F6; --tint:#F3EDEE; --line:#EEE3E5; --acc:#C24B7A; --acc-soft:#F9E0EA; --acc2:#A6D9D3; --acc2-soft:#E8F5F3; --acc2-ink:#1E7A72; --on-acc2:#0F3B37; --h1:#B23F6E; --h2:#E486AB}
/* Jaune + indigo */
:root[data-c="jaune"]{--paper:#FAF8F1; --tint:#F2EFE6; --line:#E8E3D4; --acc:#B07C08; --acc-soft:#FBEFCF; --acc2:#B7CBEF; --acc2-soft:#EDF2FB; --acc2-ink:#3462C2; --on-acc2:#14295A; --h1:#E0A21A; --h2:#F5CB4E; --on-h:#2A1F05}
@media (prefers-color-scheme:dark){:root:not([data-mode="light"]),:root:not([data-mode="light"])[data-c]{--paper:#111214; --card:#1B1C1F; --ink:#ECECEE; --muted:#9A9CA3; --line:#2C2D31; --tint:#222327; --hard:#E28C7E; --hard-soft:#3D2521;
    --on-acc:#101114; --on-acc2:#101114; color-scheme:dark;
    --acc:#6CC4A0; --acc-soft:#1E3A30; --acc2:#D4B47A; --acc2-soft:#332B1E; --acc2-ink:#D4B47A; --h1:#1A5C46; --h2:#2F8565}:root:not([data-mode="light"])[data-c="marine"]{--acc:#8EB0E6; --acc-soft:#22314C; --acc2:#DCBB82; --acc2-soft:#332A1C; --acc2-ink:#DCBB82; --on-acc2:#101114; --h1:#22406F; --h2:#3E68A6}:root:not([data-mode="light"])[data-c="rose"]{--acc:#F08DB4; --acc-soft:#4A2433; --acc2:#8CCBC4; --acc2-soft:#1B3633; --acc2-ink:#8CCBC4; --on-acc2:#101114; --h1:#8E2F57; --h2:#C2507E}:root:not([data-mode="light"])[data-c="jaune"]{--acc:#F2C14E; --acc-soft:#3E3214; --acc2:#A9BEE6; --acc2-soft:#232C42; --acc2-ink:#A9BEE6; --on-acc2:#101114; --h1:#C98F12; --h2:#E5B230; --on-h:#1E1604}
}
:root[data-mode="dark"],:root[data-mode="dark"][data-c]{--paper:#111214; --card:#1B1C1F; --ink:#ECECEE; --muted:#9A9CA3; --line:#2C2D31; --tint:#222327; --hard:#E28C7E; --hard-soft:#3D2521;
    --on-acc:#101114; --on-acc2:#101114; color-scheme:dark;
    --acc:#6CC4A0; --acc-soft:#1E3A30; --acc2:#D4B47A; --acc2-soft:#332B1E; --acc2-ink:#D4B47A; --h1:#1A5C46; --h2:#2F8565}:root[data-mode="dark"][data-c="marine"]{--acc:#8EB0E6; --acc-soft:#22314C; --acc2:#DCBB82; --acc2-soft:#332A1C; --acc2-ink:#DCBB82; --on-acc2:#101114; --h1:#22406F; --h2:#3E68A6}:root[data-mode="dark"][data-c="rose"]{--acc:#F08DB4; --acc-soft:#4A2433; --acc2:#8CCBC4; --acc2-soft:#1B3633; --acc2-ink:#8CCBC4; --on-acc2:#101114; --h1:#8E2F57; --h2:#C2507E}:root[data-mode="dark"][data-c="jaune"]{--acc:#F2C14E; --acc-soft:#3E3214; --acc2:#A9BEE6; --acc2-soft:#232C42; --acc2-ink:#A9BEE6; --on-acc2:#101114; --h1:#C98F12; --h2:#E5B230; --on-h:#1E1604}

html,body{background:var(--paper);color:var(--ink);margin:0}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
body{font-family:var(--ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background .3s}
.wrap{max-width:560px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:18px 120px;display:flex;flex-direction:column;gap:16px}
h1{font-size:28px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:8px 0 -4px}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.ar{font-family:var(--ar);direction:rtl}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:0 1px 2px rgba(20,30,25,.04),0 8px 24px rgba(20,30,25,.05)}

/* Accueil */
.hello{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:52px;height:52px;border-radius:16px;background:var(--card);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.hello .txt{flex:1;min-width:0}
.hello h1{font-size:23px}
.fire{flex:none;display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:10px 16px;font-weight:800;font-size:18px;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.fire svg{width:22px;height:22px}
.status{display:flex;align-items:center;gap:16px;text-align:left;width:100%;border:0}
.status .ic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.status b{display:block;font-size:17px}
.status span{color:var(--muted);font-size:15px}
.hero{border-radius:28px;padding:22px 24px 26px;color:#fff;background:linear-gradient(135deg,var(--h1),var(--h2));text-align:center;box-shadow:0 12px 30px -10px var(--h1)}
.hero .t{font-weight:600;font-size:17px;opacity:.92}
.ring{position:relative;width:170px;height:170px;margin:14px auto 18px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:grid;place-content:center}
.ring .p{font-size:46px;font-weight:800;line-height:1}
.ring .s{font-size:14px;opacity:.85;margin-top:6px}
.hbar{height:10px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.hbar i{display:block;height:100%;background:rgba(255,255,255,.8);border-radius:5px;transition:width .5s}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{text-align:center;padding:20px 16px 18px}
.tile.n{background:var(--acc-soft)}
.tile .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px}
.tile.n .ic{color:var(--acc)} .tile.o .ic{background:var(--acc2-soft);color:var(--acc2-ink)}
.tile .p{font-size:32px;font-weight:800;line-height:1.1}
.tile .k{font-weight:700;font-size:17px}
.tile .s{color:var(--muted);font-size:14px}
.tbar{height:7px;border-radius:4px;background:rgba(0,0,0,.06);margin-top:12px;overflow:hidden}
.tbar i{display:block;height:100%;border-radius:4px}
.tile.n .tbar i{background:var(--acc)} .tile.o .tbar i{background:var(--acc2)}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.sgrid div{border-radius:18px;padding:14px 6px;text-align:center;background:var(--tint)}
.sgrid div:nth-child(2){background:var(--acc2-soft)}
.sgrid b{display:block;font-size:26px;font-weight:800;line-height:1.1}
.sgrid span{font-size:13px;color:var(--muted)}
.ctitle{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
.ctitle svg{color:var(--acc)}
.prog{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.heat{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--line);max-width:100%}
.heat i.l1{background:var(--acc-soft)} .heat i.l2{background:var(--acc)}

/* Listes */
.list{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.medal{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--acc2);color:var(--acc2-ink);display:grid;place-items:center;font-size:13px;font-weight:800}
.name{flex:1;min-width:0}
.name .t{font-weight:700}
.name .m{font-size:13px;color:var(--muted)}
.right{text-align:right;font-size:22px}
.bar{display:flex;gap:3px;margin-top:6px}
.bar i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.bar i.on{background:var(--acc)}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.rate button{border:0;border-radius:14px;padding:12px 4px;font-weight:700;font-size:14px}
.r-hard{background:var(--hard-soft);color:var(--hard)}
.r-mid{background:var(--acc2-soft);color:var(--acc2-ink)}
.r-easy{background:var(--acc-soft);color:var(--acc)}
.empty{text-align:center;padding:26px 18px}
.empty .ar{font-size:32px;color:var(--acc)}
.empty p{color:var(--muted);margin:8px 0 0}
.search{width:100%;border:0;background:var(--card);border-radius:16px;padding:14px 16px;font:inherit;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.chip.add{border-style:dashed;color:var(--acc);border-color:var(--acc)}
.slist{padding:4px 16px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.check{flex:none;width:28px;height:28px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center}
.check.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}

/* Réglages */
.field{width:100%;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;margin-top:10px}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.th{border:2px solid transparent;background:var(--paper);border-radius:18px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700;font-size:14px}
.th.on{border-color:var(--acc)}
.th i{width:44px;height:44px;border-radius:50%;display:block}
.btn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:14px;padding:10px;font:12px ui-monospace,monospace;margin-top:10px}
.note{font-size:14px;color:var(--muted)}


/* Révision par pages */
button.card{border:0;font:inherit;color:inherit;width:100%}
.tile{display:block}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tag{flex:none;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);background:var(--acc-soft);padding:5px 10px;border-radius:999px}
.blk.o .tag{color:var(--acc2-ink);background:var(--acc2-soft)}
.rng{color:var(--muted);font-size:15px;margin-top:6px}
.pgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:14px}
.pg{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 4px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:4px}
.pg.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.bf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
.plist{padding:6px 18px}
.prow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pd{flex:none;width:110px;font-size:15px}
.prow.now .pd b{color:var(--acc)}
.prow .pr{flex:1;min-width:0;font-size:14px;color:var(--muted)}
.okb{flex:none;width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center}
/* Réglages */
.sh{display:flex;align-items:center;gap:14px}
.si{flex:none;width:52px;height:52px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center}
.si.s2{background:var(--acc2-soft);color:var(--acc2)}
.st{font-weight:800;font-size:19px;line-height:1.2}
.ss{color:var(--muted);font-size:15px;margin-top:2px}
.fl{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.pick{position:relative;display:flex;align-items:center;gap:14px;background:var(--tint);border-radius:22px;padding:14px 20px}
.pick .pn{font-weight:800;font-size:20px;color:var(--acc);min-width:44px}
.pick .pt{flex:1;min-width:0;display:flex;flex-direction:column}
.pick .pt b{font-size:17px}
.pick .pt .ar{font-size:18px;line-height:1.3;text-align:left;direction:rtl;align-self:flex-start}
.pick svg{color:var(--muted)}
.pick select{position:absolute;inset:0;opacity:0;width:100%;font-size:16px}
.pill{display:flex;align-items:center;gap:10px;background:var(--acc-soft);color:var(--ink);border-radius:999px;padding:13px 18px;margin-top:14px;font-size:15px}
.pill svg{color:var(--acc);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--tint);border-radius:22px;padding:6px;margin-top:16px}
.seg button{border:0;background:none;border-radius:18px;padding:14px 6px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted)}
.seg button.on{background:var(--acc);color:var(--on-acc);box-shadow:0 6px 16px -6px var(--acc)}
.lt{font-weight:800;font-size:17px}
.ld{color:var(--muted);font-size:15px;margin-top:4px}
.numf{display:flex;align-items:center;background:var(--tint);border-radius:22px;padding:6px 22px;margin-top:12px}
.numf input{flex:1;min-width:0;border:0;background:none;font:800 26px var(--ui);color:var(--ink);padding:12px 0;-moz-appearance:textfield}
.numf input::-webkit-inner-spin-button{-webkit-appearance:none}
.numf span{color:var(--muted);font-size:18px}
hr{border:0;border-top:1px solid var(--line);margin:22px 0 18px}
.sum{background:var(--tint)}
.sr{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;font-size:15px}
.sr span{color:var(--muted)} .sr b{text-align:right}
.reset{border:0;background:var(--hard-soft);color:var(--hard);border-radius:999px;padding:15px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px}
.savebar{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:4;margin-top:4px}
.savebtn{width:100%;border:0;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:18px;font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 24px -8px var(--acc)}

.sus{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.su{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--paper);border-radius:16px;padding:11px 14px;text-align:left}
.su .sc{flex:none;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--on-acc)}
.su .sn{flex:1;min-width:0;display:flex;flex-direction:column}
.su .sn b{font-size:16px}
.su .sn span{font-size:13px;color:var(--muted)}
.su .ar{font-size:24px;line-height:1.3}
.su.on{border-color:var(--acc);background:var(--acc-soft)}
.su.on .sc{background:var(--acc);border-color:var(--acc)}
.logo{overflow:hidden;padding:0}
.logo img{width:100%;height:100%;display:block;object-fit:cover}
.icons{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.ico{border:3px solid transparent;background:none;border-radius:26%;padding:3px}
.ico img{width:100%;display:block;border-radius:22%;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.ico.on{border-color:var(--acc)}
.ico span{display:block;font-weight:700;font-size:14px;margin-top:8px;color:var(--ink)}
.howto{background:var(--tint);border-radius:18px;padding:14px 16px;margin-top:16px;font-size:15px}
.howto ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.lk{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.lk span{font-weight:700;word-break:break-all;flex:1;min-width:0}
/* Sourate : case + nom */
.su{padding:0;gap:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.su .sc{margin:0 4px 0 12px;width:30px;height:30px;padding:0}
.su .sb{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 14px 11px 8px;text-align:left;-webkit-touch-callout:none}
.su .sn em{font-style:normal;font-weight:700;color:var(--hard)}
.su.weak{border-style:dashed}
.blk.w .ctitle svg{color:var(--hard)}
.memo .mrow{display:flex;gap:8px;margin-top:14px}
.memo .grow{flex:1}
.memo .mrow .btn:last-child{width:52px;font-size:20px;padding:10px 0}
.memo .ctitle svg{color:var(--acc)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.dy{border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:12px 0;font-weight:700;font-size:14px}
.dy.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.heat i.off{background:transparent;border:1.5px dashed var(--line)}
.prow.offd .pr{font-style:italic}
/* Lecteur */
.reader{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rdh{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--card)}
.rdx{border:0;background:var(--tint);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.rdt{flex:1;min-width:0;display:flex;flex-direction:column}

.tgl i{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .2s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.tgl.on i{background:var(--acc)}
.tgl.on i::after{transform:translateX(18px)}

nav{position:fixed;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:540px;margin:0 auto;background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-radius:30px;display:flex;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.12);z-index:5}
nav button{flex:1;border:0;background:none;border-radius:24px;padding:8px 2px 7px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--acc);background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.08)}
nav button.on span{font-weight:800}
nav svg{width:24px;height:24px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;z-index:9;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.card,.hero{animation:in .3s ease}@keyframes in{from{transform:translateY(6px)}}}
